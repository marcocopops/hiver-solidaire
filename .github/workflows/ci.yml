name: CI

on:
  pull_request:
  push:
    branches: [main]

# Droits minimaux par défaut ; chaque job n'élève que ce dont il a besoin.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ghcr.io/marcocopops/hiver-solidaire

jobs:
  verify:
    name: Tests (./mvnw verify)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Testcontainers démarre un vrai PostgreSQL : Docker est fourni par le runner.
      - run: ./mvnw -B verify

  # Scripts d'exploitation (deploy/, scripts/) : aucun avertissement de shellcheck. Image épinglée par empreinte, la
  # même qu'en local (CLAUDE.md) ; celle du runner (0.9.0) est plus ancienne. Aucun secret, lecture seule.
  shellcheck:
    name: Scripts (shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: >-
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt
          koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
          -x deploy/*.sh scripts/*.sh

  dependency-review:
    name: Revue des dépendances
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  # Construit l'image, la scanne, puis la transmet telle quelle au job de publication.
  # Aucun secret, aucun droit d'écriture : ce job exécute du code de la PR ou de main.
  build-and-scan:
    name: Image (construction et scan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image (sans publication)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: hiver-solidaire:ci
          # Commit de l'image, lisible sur le serveur (runbook, « Épingler la version ») : docker inspect.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
      - name: Load image for scanning
        run: docker load --input "${{ runner.temp }}/image.tar"
      - name: Scan image (échec sur CRITICAL)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: hiver-solidaire:ci
          fail-build: true
          severity-cutoff: critical
          output-format: table
      - name: Upload image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1
          if-no-files-found: error

  # Pousse l'image déjà scannée : pas de reconstruction, pas de scanner.
  publish:
    name: Publication sur GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, build-and-scan, shellcheck]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}
      - name: Load image
        run: docker load --input "${{ runner.temp }}/image.tar"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and push
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          docker tag hiver-solidaire:ci "${IMAGE_NAME}:sha-${COMMIT_SHA}"
          docker tag hiver-solidaire:ci "${IMAGE_NAME}:main"
          docker push "${IMAGE_NAME}:sha-${COMMIT_SHA}"
          docker push "${IMAGE_NAME}:main"
