spring:
  application:
    name: hiver-solidaire
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/hiver}
    username: ${DB_USER:hiver}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  thymeleaf:
    cache: true
  # Session de 30 jours en base, qui survit aux redémarrages (ADR-0007). Schéma versionné par Flyway (V6).
  session:
    timeout: 30d
    jdbc:
      initialize-schema: never
  # SMTP (Mailpit en développement). Sans MAIL_HOST, aucun envoi n'est configuré : l'appli démarre et la
  # demande de lien affiche un message d'indisponibilité neutre (cas de la production avant S5).
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${MAIL_SMTP_AUTH:true}
      "[mail.smtp.starttls.enable]": ${MAIL_STARTTLS:true}
      "[mail.smtp.starttls.required]": ${MAIL_STARTTLS:true}
      "[mail.smtp.connectiontimeout]": 10000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000

app:
  # Origine publique de l'appli, pour construire le lien magique. Jamais déduite de l'en-tête Host de la
  # requête (empoisonnement du lien).
  base-url: ${APP_BASE_URL:http://localhost:8080}
  mail:
    from: ${MAIL_FROM:hiver-solidaire@example.org}
  # Téléphone des coordinateurs, affiché après la limite de désinscription (R6). Vide : message générique.
  coordinators:
    phone: ${APP_COORDINATORS_PHONE:}

server:
  port: 8080
  # Derrière cloudflared : prend en compte X-Forwarded-*. Seul cloudflared peut joindre l'appli
  # (réseau Docker dédié, aucun port publié sur l'hôte).
  forward-headers-strategy: native
  # Cookie de session : voir auth.SessionCookieConfig (__Host-SESSION, Secure, HttpOnly, SameSite=Lax, 30 jours).
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health
  health:
    # Le SMTP n'est pas une dépendance vitale : sans lui l'appli sert le planning, et la demande de lien affiche
    # un message d'indisponibilité. Il ne doit pas faire redémarrer le conteneur.
    mail:
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: INFO
