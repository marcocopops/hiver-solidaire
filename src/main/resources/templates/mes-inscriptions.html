<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(#{common.myRegistrations})}"></head>
<body>
<header th:replace="~{fragments :: entete(#{common.myRegistrations}, true)}"></header>
<main class="page">
    <nav th:replace="~{fragments :: nav}"></nav>
    <p class="bandeau" role="status" th:if="${cancelled != null}"
       th:text="#{myRegistrations.cancelled(${#messages.msg(cancelled.key, cancelled.date)})}">
        Désinscription enregistrée.</p>
    <p th:if="${registrations.isEmpty()}" th:text="#{myRegistrations.none}">Aucune inscription à venir.</p>
    <ul class="soirees" th:unless="${registrations.isEmpty()}">
        <li class="soiree" th:each="registration : ${registrations}">
            <span class="soiree__date"
                  th:text="${#messages.msg(registration.activity.key, registration.activity.date)}">
                Dîner du lun. 4 janv.</span>
            <p class="soiree__manque" th:text="#{${'registration.option.' + registration.option}}">Type</p>
            <p class="soiree__action" th:if="${registration.cancellable}">
                <a class="bouton bouton--secondaire" th:href="@{/mes-inscriptions/annuler(soiree=${registration.date})}"
                   th:text="#{myRegistrations.cancel}">Me désinscrire</a>
            </p>
            <p class="aide" th:if="${registration.cancellable}"
               th:text="#{cancellation.deadline(${registration.deadline})}">Possible jusqu’au…</p>
            <th:block th:unless="${registration.cancellable}">
                <p th:replace="~{fragments :: coordinators(#{myRegistrations.tooLate})}">Trop tard.</p>
            </th:block>
        </li>
    </ul>
    <th:block th:if="${season != null and (season.venueAddress != null or season.instructions != null)}">
        <h2 th:text="#{myRegistrations.venue}">Le lieu d’accueil</h2>
        <p th:if="${season.venueAddress != null}" th:text="${season.venueAddress}">Adresse</p>
        <p class="consignes" th:if="${season.instructions != null}" th:text="${season.instructions}">Consignes</p>
    </th:block>
</main>
</body>
</html>
