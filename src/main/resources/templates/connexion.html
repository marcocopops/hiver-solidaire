<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(#{login.title})}"></head>
<body>
<header th:replace="~{fragments :: entete(#{login.title}, false)}"></header>
<main class="page">

    <p class="alerte" role="alert" th:if="${invalidLink}" th:text="#{login.invalidLink}">Lien plus valable.</p>
    <p class="alerte" role="alert" th:if="${unavailable}" th:text="#{login.unavailable}">Indisponible.</p>
    <p class="alerte" role="alert" th:if="${turnstileFailed}" th:text="#{login.turnstile.failed}">
        Vérification non aboutie.</p>
    <p class="alerte" role="alert" th:if="${turnstileUnavailable}" th:text="#{login.turnstile.unavailable}">
        Vérification impossible.</p>

    <th:block th:unless="${unavailable}">
        <p th:text="${choice != null} ? #{login.intro.choice} : #{login.intro}">Saisissez votre adresse e-mail.</p>
        <form class="formulaire" th:action="@{/connexion}" method="post" novalidate>
            <th:block th:replace="~{fragments :: choice(${choice})}"></th:block>
            <div class="champ">
                <label for="email" th:text="#{login.email}">Adresse e-mail</label>
                <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required
                       maxlength="254" th:value="${email}"
                       th:attr="aria-invalid=${invalidEmail != null} ? 'true' : 'false',
                                aria-describedby=${invalidEmail != null} ? 'email-error' : null">
                <p class="erreur" id="email-error" th:if="${invalidEmail}" th:text="#{login.error.email}">
                    Adresse invalide.</p>
            </div>
            <!-- Turnstile (ADR-0013) : le script de Cloudflare remplit le champ cf-turnstile-response du formulaire. -->
            <div class="cf-turnstile champ" th:attr="data-sitekey=${turnstileSiteKey}" data-language="fr"
                 data-theme="light" data-size="flexible"></div>
            <noscript><p class="aide" th:text="#{login.turnstile.noscript}">JavaScript est nécessaire.</p></noscript>
            <button class="bouton" type="submit" th:text="#{login.submit}">Recevoir le lien</button>
        </form>
        <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    </th:block>
</main>
</body>
</html>
