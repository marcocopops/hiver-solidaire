<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title th:text="${title} + ' · ' + #{app.name}">Page · Hiver Solidaire</title>
    <link rel="preload" th:href="@{/fonts/atkinson-hyperlegible-latin-400-normal.woff2}" as="font" type="font/woff2"
          crossorigin>
    <link rel="preload" th:href="@{/fonts/atkinson-hyperlegible-latin-700-normal.woff2}" as="font" type="font/woff2"
          crossorigin>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<!-- En-tête de chaque page : nom de l'appli (vers l'accueil), « Mon espace » ou « Me connecter », titre de la page. -->
<header class="entete" th:fragment="entete(title)">
    <div class="entete__contenu">
        <div class="entete__barre">
            <a class="entete__marque" th:href="@{/}">
                <svg class="icone" aria-hidden="true" focusable="false"><use th:href="@{/images/icones.svg#lune}"></use></svg>
                <span th:text="#{app.name}">Hiver Solidaire</span>
            </a>
            <a class="entete__action" th:if="${signedIn}" th:href="@{/mes-inscriptions}"
               th:text="#{header.mySpace}">Mon espace</a>
            <a class="entete__action" th:unless="${signedIn}" th:href="@{/connexion}"
               th:text="#{header.signIn}">Me connecter</a>
        </div>
        <h1 th:text="${title}">Titre de la page</h1>
    </div>
</header>

<!-- Navigation : retour au planning ; pour un bénévole connecté, ses inscriptions, son compte et la déconnexion (POST). -->
<nav class="nav" th:fragment="nav">
    <a th:href="@{/planning}" th:text="#{common.back.planning}">Retour au planning</a>
    <th:block th:if="${signedIn}">
        <a th:href="@{/mes-inscriptions}" th:text="#{common.myRegistrations}">Mes inscriptions</a>
        <a th:href="@{/mon-compte}" th:text="#{common.myAccount}">Mon compte</a>
        <form class="nav__deconnexion" th:action="@{/deconnexion}" method="post">
            <button class="lien" type="submit" th:text="#{common.logout}">Me déconnecter</button>
        </form>
    </th:block>
</nav>

<!-- R6 : après la limite, le téléphone des coordinateurs (APP_COORDINATORS_PHONE), ou un message générique. -->
<p class="aide" th:fragment="coordinators(intro)">
    <th:block th:text="${intro}">Pour vous désinscrire maintenant,</th:block>
    <th:block th:if="${coordinatorsPhone != null}">
        <th:block th:text="#{coordinators.call}">appelez un coordinateur :</th:block>
        <a th:href="${coordinatorsPhone.telUri}" th:text="${coordinatorsPhone.display}">01 99 00 12 34</a>
    </th:block>
    <th:block th:if="${coordinatorsPhone == null}" th:text="#{coordinators.contact}">contactez un coordinateur.</th:block>
</p>

<!-- Champs cachés qui portent le choix fait sur le planning (journée, type, plat) d'une page à l'autre. -->
<th:block th:fragment="choice(choice)">
    <th:block th:if="${choice != null}">
        <input type="hidden" name="jour" th:value="${choice.day}">
        <input type="hidden" name="choix" th:value="${choice.choiceParam()}">
    </th:block>
</th:block>
</body>
</html>
