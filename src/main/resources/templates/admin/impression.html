<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(#{admin.print.title(${from}, ${to})})}"></head>
<body>
<header th:replace="~{fragments :: entete(#{admin.print.title(${from}, ${to})}, true)}"></header>
<main class="page page--large">
    <nav th:replace="~{admin/fragments :: nav}"></nav>
    <p class="aide ne-pas-imprimer" th:text="#{admin.print.instructions}">Imprimer, puis enregistrer en PDF.</p>
    <p th:if="${days.isEmpty()}" th:text="#{planning.none}">Aucune journée.</p>
    <section class="impression__jour" th:each="day : ${days}">
        <h2 th:text="${day.label}">Lun. 4 janv.</h2>
        <table class="tableau">
            <tbody>
            <tr th:each="post : ${day.posts}">
                <th scope="row" th:text="#{${post.postKey}}">Nuit</th>
                <td>
                    <th:block th:each="person, iter : ${post.people}">
                        <th:block th:text="${person.name} + ' (' + ${person.pseudo} + ') ' + ${person.phone}">Martin Anne (AnneM) +33600000001</th:block><br th:unless="${iter.last}">
                    </th:block>
                    <strong th:if="${post.missing > 0}" th:text="#{admin.print.missing(${post.missing})}">1 place à pourvoir</strong>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
