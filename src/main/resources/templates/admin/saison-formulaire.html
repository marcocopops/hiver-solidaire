<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Champs d'une saison, communs à la création et à la modification. -->
<th:block th:fragment="fields">
    <p class="erreur" th:if="${#fields.hasGlobalErrors()}" th:each="error : ${#fields.globalErrors()}" th:text="${error}">Erreur.</p>

    <label for="label" th:text="#{admin.season.label}">Nom de la saison</label>
    <input id="label" type="text" required maxlength="100" th:field="*{label}">
    <p class="erreur" th:if="${#fields.hasErrors('label')}" th:text="#{admin.season.error.label}">Nom.</p>

    <div class="formulaire formulaire--ligne">
        <div>
            <label for="firstEvening" th:text="#{admin.season.firstEvening}">Première soirée</label>
            <input id="firstEvening" type="date" required th:field="*{firstEvening}" aria-describedby="dates-hint">
        </div>
        <div>
            <label for="lastEvening" th:text="#{admin.season.lastEvening}">Dernière soirée</label>
            <input id="lastEvening" type="date" required th:field="*{lastEvening}" aria-describedby="dates-hint">
        </div>
    </div>
    <p class="aide" id="dates-hint" th:text="#{admin.season.dates.hint}">Dates du soir.</p>
    <p class="erreur" th:if="${#fields.hasErrors('firstEvening') or #fields.hasErrors('lastEvening') or #fields.hasErrors('datesValid')}"
       th:text="#{admin.season.error.dates}">Dates.</p>

    <label for="registrationsOpenAt" th:text="#{admin.season.opensAt}">Ouverture</label>
    <input id="registrationsOpenAt" type="datetime-local" required th:field="*{registrationsOpenAt}">
    <p class="erreur" th:if="${#fields.hasErrors('registrationsOpenAt')}" th:text="#{admin.season.error.opensAt}">Ouverture.</p>

    <fieldset>
        <legend th:text="#{admin.season.needs}">Besoins par soirée</legend>
        <div class="tableau-defilant">
            <table class="tableau">
                <thead>
                <tr>
                    <th scope="col"></th>
                    <th scope="col" th:text="#{admin.season.minimum}">Minimum</th>
                    <th scope="col" th:text="#{admin.season.maximum}">Maximum</th>
                    <th scope="col" th:text="#{admin.season.schedule}">Horaires</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="need, iter : *{needs}">
                    <th scope="row" th:text="#{${'planning.post.' + need.post}}">Nuit
                    </th>
                    <td>
                        <input type="hidden" th:field="*{needs[__${iter.index}__].post}">
                        <input type="number" min="0" max="10" required th:field="*{needs[__${iter.index}__].minimum}"
                               th:attr="aria-label=#{admin.season.minimum}">
                    </td>
                    <td><input type="number" min="0" max="10" required th:field="*{needs[__${iter.index}__].maximum}"
                               th:attr="aria-label=#{admin.season.maximum}"></td>
                    <td><input type="text" maxlength="100" th:field="*{needs[__${iter.index}__].schedule}"
                               th:attr="aria-label=#{admin.season.schedule}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </fieldset>
    <p class="erreur" th:if="${#fields.hasErrors('needs*') or #fields.hasErrors('needsComplete')}" th:text="#{admin.season.error.need}">Besoins.</p>

    <label for="venueAddress" th:text="#{admin.season.venue}">Adresse du lieu</label>
    <input id="venueAddress" type="text" maxlength="300" th:field="*{venueAddress}" aria-describedby="venue-hint">
    <p class="aide" id="venue-hint" th:text="#{admin.season.venue.hint}">Jamais publique.</p>
    <p class="erreur" th:if="${#fields.hasErrors('venueAddress')}" th:text="#{admin.season.error.venue}">Adresse.</p>

    <label for="instructions" th:text="#{admin.season.instructions}">Consignes</label>
    <textarea id="instructions" rows="6" maxlength="2000" th:field="*{instructions}"></textarea>
    <p class="erreur" th:if="${#fields.hasErrors('instructions')}" th:text="#{admin.season.error.instructions}">Consignes.</p>

    <label for="coordinatorsPhone" th:text="#{admin.season.phone}">Téléphone des coordinateurs</label>
    <input id="coordinatorsPhone" type="tel" maxlength="30" th:field="*{coordinatorsPhone}" aria-describedby="phone-hint">
    <p class="aide" id="phone-hint" th:text="#{admin.season.phone.hint}">Vide : configuration.</p>
    <p class="erreur" th:if="${#fields.hasErrors('coordinatorsPhone')}" th:text="#{admin.season.error.phone}">Téléphone.</p>
</th:block>
</body>
</html>
