<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(#{admin.season.title})}"></head>
<body>
<header th:replace="~{fragments :: entete(#{admin.season.title}, true)}"></header>
<main class="page page--large">
    <nav th:replace="~{admin/fragments :: nav}"></nav>
    <p th:replace="~{admin/fragments :: done}"></p>
    <p class="alerte" role="alert" th:if="${blockingDates != null}" th:text="#{admin.season.blocking(${blockingDates})}">
        Dates bloquées.</p>
    <form class="formulaire" th:action="@{/admin/saison}" th:object="${seasonForm}" method="post" novalidate>
        <th:block th:replace="~{admin/fragments :: seasonFields}"></th:block>
        <button class="bouton" type="submit" th:text="#{admin.season.submit}">Enregistrer la saison</button>
    </form>
</main>
</body>
</html>
