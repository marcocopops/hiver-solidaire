<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(#{admin.newVolunteer.title})}"></head>
<body>
<header th:replace="~{fragments :: entete(#{admin.newVolunteer.title}, true)}"></header>
<main class="page page--large">
    <p th:text="#{admin.newVolunteer.intro}">Pour un bénévole qui s’inscrit par téléphone.</p>

    <form class="formulaire" th:action="@{/admin/benevoles/nouveau}" th:object="${profileForm}" method="post" novalidate>
        <input type="hidden" name="jour" th:if="${date != null}" th:value="${date}">

        <label for="lastName" th:text="#{profile.lastName}">Nom</label>
        <input id="lastName" type="text" autocomplete="family-name" required maxlength="100" th:field="*{lastName}"
               th:attr="aria-invalid=${#fields.hasErrors('lastName')} ? 'true' : 'false'">
        <p class="erreur" th:if="${#fields.hasErrors('lastName')}" th:text="#{profile.error.lastName}">Nom.</p>

        <label for="firstName" th:text="#{profile.firstName}">Prénom</label>
        <input id="firstName" type="text" autocomplete="given-name" required maxlength="100"
               th:field="*{firstName}"
               th:attr="aria-invalid=${#fields.hasErrors('firstName')} ? 'true' : 'false'">
        <p class="erreur" th:if="${#fields.hasErrors('firstName')}" th:text="#{profile.error.firstName}">Prénom.</p>

        <label for="pseudo" th:text="#{profile.pseudo}">Pseudo</label>
        <p class="bandeau" th:if="${pseudoSuggested}" th:text="#{profile.pseudo.suggested}">Pseudo proposé.</p>
        <input id="pseudo" type="text" autocomplete="nickname" required minlength="3" maxlength="20"
               spellcheck="false" autocapitalize="off" th:field="*{pseudo}" aria-describedby="pseudo-hint"
               th:attr="aria-invalid=${#fields.hasErrors('pseudo') or pseudoTaken != null} ? 'true' : 'false'">
        <p class="aide" id="pseudo-hint" th:text="#{profile.pseudo.hint}">Votre pseudo est public.</p>
        <p class="erreur" th:if="${#fields.hasErrors('pseudo')}" th:text="#{profile.error.pseudo}">Pseudo.</p>
        <p class="erreur" th:if="${pseudoTaken != null}" th:text="#{profile.error.pseudoTaken(${pseudoTaken})}">
            Pris.</p>

        <fieldset class="telephone" aria-describedby="phone-hint">
            <legend th:text="#{profile.phone}">Téléphone</legend>
            <div class="telephone__champs">
                <div class="telephone__indicatif">
                    <label for="phoneCountryCode" th:text="#{profile.phoneCountryCode}">Indicatif</label>
                    <input id="phoneCountryCode" type="text" autocomplete="tel-country-code" inputmode="tel"
                           required maxlength="6" th:field="*{phoneCountryCode}"
                           th:attr="aria-invalid=${#fields.hasErrors('phoneCountryCode')} ? 'true' : 'false'">
                </div>
                <div class="telephone__numero">
                    <label for="phone" th:text="#{profile.phoneNumber}">Numéro</label>
                    <input id="phone" type="tel" autocomplete="tel-national" inputmode="tel" required maxlength="30"
                           th:field="*{phone}"
                           th:attr="aria-invalid=${#fields.hasErrors('phone') or #fields.hasErrors('phoneValid')} ? 'true' : 'false'">
                </div>
            </div>
        </fieldset>
        <p class="aide" id="phone-hint" th:text="#{profile.phone.hint}">Indicatif +33 pour la France.</p>
        <p class="erreur" th:if="${#fields.hasErrors('phoneCountryCode')}" th:text="#{profile.error.phoneCountryCode}">
            Indicatif.</p>
        <p class="erreur" th:if="${#fields.hasErrors('phone') or #fields.hasErrors('phoneValid')}"
           th:text="#{profile.error.phone}">Téléphone.</p>

        <button class="bouton" type="submit" th:text="#{admin.newVolunteer.submit}">Créer le bénévole</button>
    </form>
    <p th:if="${date != null}"><a th:href="@{/admin/journee(jour=${date})}" th:text="#{admin.back.day}">Retour</a></p>
</main>
</body>
</html>
