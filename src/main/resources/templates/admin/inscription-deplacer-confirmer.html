<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(#{admin.move.title})}"></head>
<body>
<header th:replace="~{fragments :: entete(#{admin.move.title}, true)}"></header>
<main class="page page--large">
    <nav th:replace="~{admin/fragments :: nav}"></nav>
    <p class="alerte" role="alert" th:if="${refusal != null}" th:text="#{${'admin.refusal.' + refusal}}">Refus.</p>
    <dl th:replace="~{admin/fragments :: recap(${line})}"></dl>
    <p class="bandeau" th:text="#{admin.move.confirm(${#messages.msg(targetActivity.key, targetActivity.date)})}">
        Déplacer vers : Dîner du mar. 5 janv.</p>
    <form class="formulaire" th:action="@{/admin/inscriptions/deplacer}" method="post">
        <input type="hidden" name="inscription" th:value="${line.registrationId}">
        <input type="hidden" name="jour" th:value="${target}">
        <button class="bouton" type="submit" th:text="#{admin.move.submit}">Confirmer le déplacement</button>
    </form>
    <p><a th:href="@{/admin/inscriptions/deplacer(inscription=${line.registrationId})}" th:text="#{admin.move.change}">
        Choisir une autre journée</a></p>
    <p><a th:href="@{/admin/journee(jour=${day})}" th:text="#{admin.back.day}">Retour à la journée</a></p>
</main>
</body>
</html>
