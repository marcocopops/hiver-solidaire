<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(#{admin.season.new.title})}"></head>
<body>
<header th:replace="~{fragments :: entete(#{admin.season.new.title}, true)}"></header>
<main class="page page--large">
    <p class="alerte" role="alert" th:unless="${creationAllowed}" th:text="#{admin.season.alreadyActive}">Déjà active.</p>
    <th:block th:if="${creationAllowed}">
        <p class="bandeau" th:if="${sample != null}" th:text="#{admin.season.sample}">Saison d'exemple.</p>
        <p class="alerte" role="alert" th:if="${sampleRegistrations > 0}"
           th:text="#{admin.season.sampleInUse(${sampleRegistrations})}">Inscriptions actives.</p>
        <form class="formulaire" th:if="${sampleRegistrations == 0}" th:action="@{/admin/saison/nouvelle}"
              th:object="${seasonForm}" method="post" novalidate>
            <th:block th:replace="~{admin/fragments :: seasonFields}"></th:block>
            <button class="bouton" type="submit" th:text="#{admin.season.create}">Créer la saison</button>
        </form>
    </th:block>
</main>
</body>
</html>
