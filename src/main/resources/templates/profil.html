<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(#{profile.title})}"></head>
<body>
<main class="page">
    <nav th:replace="~{fragments :: nav}"></nav>
    <h1 th:text="#{profile.title}">Vos coordonnées</h1>
    <p th:text="#{profile.intro}">Première connexion.</p>

    <form class="formulaire" th:action="@{/profil}" th:object="${profileForm}" method="post" novalidate>
        <th:block th:replace="~{fragments :: choice(${choice})}"></th:block>

        <label for="lastName" th:text="#{profile.lastName}">Nom</label>
        <input id="lastName" type="text" autocomplete="family-name" required maxlength="100" th:field="*{lastName}"
               th:attr="aria-invalid=${#fields.hasErrors('lastName')} ? 'true' : 'false'">
        <p class="erreur" th:if="${#fields.hasErrors('lastName')}" th:text="#{profile.error.lastName}">Nom.</p>

        <label for="firstName" th:text="#{profile.firstName}">Prénom</label>
        <input id="firstName" type="text" autocomplete="given-name" required maxlength="100"
               th:field="*{firstName}"
               th:attr="aria-invalid=${#fields.hasErrors('firstName')} ? 'true' : 'false'">
        <p class="erreur" th:if="${#fields.hasErrors('firstName')}" th:text="#{profile.error.firstName}">Prénom.</p>

        <label for="phone" th:text="#{profile.phone}">Téléphone</label>
        <input id="phone" type="tel" autocomplete="tel" inputmode="tel" required maxlength="30" th:field="*{phone}"
               aria-describedby="phone-hint"
               th:attr="aria-invalid=${#fields.hasErrors('phone')} ? 'true' : 'false'">
        <p class="aide" id="phone-hint" th:text="#{profile.phone.hint}">Numéro français.</p>
        <p class="erreur" th:if="${#fields.hasErrors('phone')}" th:text="#{profile.error.phone}">Téléphone.</p>

        <div class="case">
            <input id="recontactNextSeason" type="checkbox" th:field="*{recontactNextSeason}"
                   aria-describedby="recontact-hint">
            <label for="recontactNextSeason1" th:text="#{profile.recontact}">Me recontacter</label>
        </div>
        <p class="aide" id="recontact-hint" th:text="#{profile.recontact.hint}">Sans cette case…</p>

        <p><a th:href="@{/notice}" target="_blank" rel="noopener" th:text="#{profile.notice}">Notice</a></p>

        <button class="bouton" type="submit" th:text="#{profile.submit}">Continuer</button>
    </form>
</main>
</body>
</html>
