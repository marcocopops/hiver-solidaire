<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(#{login.sent.title})}"></head>
<body>
<header th:replace="~{fragments :: entete(#{login.sent.title}, false)}"></header>
<main class="page">
    <p class="lead" th:text="#{login.sent.text}">Si cette adresse est valide, vous allez recevoir un lien.</p>
    <p th:text="#{login.sent.otherDevice}">Vous pouvez ouvrir le lien sur un autre appareil.</p>
    <p th:text="#{login.sent.nothing}">Rien reçu ?</p>
    <p><a class="bouton bouton--secondaire" th:href="@{/connexion}" th:text="#{login.sent.again}">
        Demander un nouveau lien</a></p>
</main>
<footer th:replace="~{fragments :: pied}"></footer>
</body>
</html>
