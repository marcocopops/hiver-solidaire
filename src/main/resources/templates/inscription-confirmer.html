<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(#{registration.confirm.title})}"></head>
<body>
<header th:replace="~{fragments :: entete(#{registration.confirm.title}, true)}"></header>
<main class="page">
    <dl class="recap">
        <dt th:text="#{registration.recap.when}">Quand</dt>
        <dd th:text="${#messages.msg(activity.key, activity.date)}">Dîner du lun. 4 janv.</dd>
        <dt th:text="#{registration.recap.option}">Ce que vous proposez</dt>
        <dd th:text="#{${'registration.option.' + choice.choiceParam()}}">Type</dd>
    </dl>
    <p class="aide" th:if="${choice.type.name() == 'PREPARE_AT_HOME'}" th:text="#{registration.hint.atHome}">
        Remise organisée.</p>
    <form class="formulaire" th:action="@{/inscription}" method="post">
        <th:block th:replace="~{fragments :: choice(${choice})}"></th:block>
        <button class="bouton" type="submit" th:text="#{registration.confirm.submit}">Confirmer</button>
    </form>
    <p><a class="bouton bouton--secondaire" th:href="@{/inscription(jour=${choice.day})}"
          th:text="#{registration.confirm.change}">Changer</a></p>
</main>
<footer th:replace="~{fragments :: pied}"></footer>
</body>
</html>
