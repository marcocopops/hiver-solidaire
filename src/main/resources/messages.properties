# Notice d'information (§7, S5b). Aucune donnée réelle : l'organisateur ({0} de notice.controller.text) et le contact
# viennent des réglages de la saison ; les durées, de privacy.RetentionPolicy.
notice.title=Vos données personnelles
notice.intro=Cette page explique quelles données le site d’inscription des bénévoles enregistre, à quoi elles servent, combien de temps elles sont gardées, et comment exercer vos droits.
notice.controller.title=Qui est responsable de vos données ?
notice.controller.text=Le responsable du traitement est {0}, qui organise l’accueil hivernal et ce planning des bénévoles.
notice.controller.unknown=l’organisateur de l’accueil, dont le nom n’est pas encore renseigné
notice.controller.contact=Pour toute question sur vos données, ou pour exercer vos droits :
notice.purposes.title=À quoi servent vos données ?
notice.purposes.text=À organiser l’accueil : afficher le planning, enregistrer vos inscriptions, vous envoyer le lien de connexion, la confirmation de vos inscriptions et un rappel la veille, et permettre aux coordinateurs de vous joindre en cas d’imprévu. Si vous l’acceptez, à vous recontacter la saison suivante. Rien d’autre : ni publicité, ni revente, ni profilage.
notice.data.title=Quelles données ?
notice.data.text=Votre adresse e-mail, votre nom, votre prénom, votre pseudo, votre numéro de téléphone, vos inscriptions (journées et postes), votre choix « Me recontacter la saison prochaine » et les dates de ces enregistrements. Il n’y a aucun champ libre, et rien n’est enregistré sur les personnes accueillies.
notice.pseudo.title=Votre pseudo est public
notice.pseudo.text=Votre pseudo est affiché sur le planning, visible par tous, sans connexion, à côté des journées où vous venez : chacun voit qui vient et peut s’inscrire avec les personnes qu’il connaît. Les journées passées disparaissent du planning, et les moteurs de recherche sont priés de ne pas l’indexer. Vous pouvez choisir autre chose que votre prénom, et changer de pseudo à tout moment dans
notice.legal.title=Sur quelle base ?
notice.legal.text=L’intérêt légitime de l’organisateur à organiser l’accueil avec ses bénévoles. La conservation de vos données d’une saison à l’autre repose sur votre consentement (case « Me recontacter la saison prochaine »), que vous pouvez retirer à tout moment.
notice.recipients.title=Qui y a accès ?
notice.recipients.text=Les coordinateurs de l’accueil (2 ou 3 personnes) voient votre nom, votre prénom, votre pseudo, votre téléphone, votre adresse e-mail et vos inscriptions, pour organiser les soirées et vous joindre. Les autres bénévoles et le public ne voient que votre pseudo.
notice.recipients.phone=Si vous vous inscrivez par téléphone, un coordinateur saisit pour vous votre nom, votre prénom, un pseudo et votre téléphone, et vous en informe. Ce compte n’a pas d’adresse e-mail : il ne permet pas de se connecter au site.
notice.processors.title=Prestataires et hébergement
notice.processors.cloudflare=Cloudflare : réseau et protection du site, et vérification anti-robot (Turnstile) sur la page de connexion. Cloudflare voit votre adresse IP et les pages consultées.
notice.processors.brevo=Brevo : envoi des e-mails (lien de connexion, confirmations, rappels). Brevo reçoit votre adresse e-mail et le contenu des e-mails ; le suivi des ouvertures et des clics est désactivé.
notice.processors.hosting=Le site et sa base de données sont hébergés sur un serveur situé en France.
notice.retention.title=Combien de temps ?
notice.retention.withoutConsent=Sans la case « Me recontacter la saison prochaine », vos données sont effacées {0,choice,1#un mois|1<{0} mois} après la fin de la saison.
notice.retention.withConsent=Avec cette case, elles sont gardées jusqu’à ce que vous la décochiez, et au plus {0} ans sans participation.
notice.retention.incomplete=Un compte dont le formulaire de première connexion n’a pas été rempli est supprimé au bout de {0} jours.
notice.retention.technical=Les traces techniques (envois d’e-mails, alertes aux coordinateurs, journal des actions des coordinateurs) sont gardées au plus {0} mois. Un lien de connexion expire au bout de 15 minutes, et la connexion au bout de 30 jours (8 heures pour un coordinateur).
notice.retention.erasure=« Effacées » veut dire anonymisées : vos inscriptions passées restent comptées dans le planning, sans aucun lien avec vous.
notice.retention.backups=Les sauvegardes du site, chiffrées, gardent une copie des données jusqu’à leur expiration, au plus {0} jours.
notice.cookies.title=Cookies
notice.cookies.text=Le site ne dépose qu’un cookie, nécessaire à la connexion : il garde votre session ouverte. Aucun cookie de mesure d’audience ni de publicité. Sur la page de connexion, la vérification anti-robot s’exécute dans un cadre fourni par Cloudflare.
notice.rights.title=Vos droits
notice.rights.access=Consulter et corriger vos données : dans « Mon compte » pour votre téléphone et votre pseudo ; auprès d’un coordinateur pour votre nom et votre prénom.
notice.rights.erase=Supprimer votre compte : dans « Mon compte », à tout moment ; vos données sont effacées aussitôt.
notice.rights.consent=Retirer votre accord pour être recontacté : dans « Mon compte », en décochant la case.
notice.rights.other=Pour toute autre demande (copie de vos données, opposition, limitation), contactez les coordinateurs (voir plus haut).
notice.rights.cnil=Si vous estimez que vos droits ne sont pas respectés, vous pouvez adresser une réclamation à la CNIL :
notice.rights.cnil.link=cnil.fr/fr/plaintes

