# E-mail du lien de connexion. {0} : le lien.
mail.magicLink.subject=Votre lien de connexion — Hiver Solidaire
mail.magicLink.body=Bonjour,\n\nVoici votre lien de connexion au planning des bénévoles d’Hiver Solidaire :\n\n{0}\n\nIl est valable 15 minutes et ne sert qu’une fois. Ouvrez-le, puis appuyez sur « Me connecter ».\n\nSi vous n’avez rien demandé, ignorez ce message : personne ne sera connecté sans ce lien.\n

