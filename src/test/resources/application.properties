# Tests : la tâche planifiée des e-mails ne tourne pas d'elle-même ; chaque test appelle MailJobs.tick() avec
# l'horloge réglable (MutableClock). Délai de regroupement des confirmations laissé à sa valeur par défaut (10 min).
app.mail.scheduler.enabled=false

# Turnstile : clés de test publiées par Cloudflare (toujours valides). Les tests web remplacent la vérification par un
# double (StubTurnstile) : jamais d'appel réseau réel.
app.turnstile.site-key=1x00000000000000000000AA
app.turnstile.secret-key=1x0000000000000000000000000000000AA
