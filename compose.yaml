# PostgreSQL et Mailpit de développement uniquement. La production est dans deploy/compose.prod.yaml.
# Nom de projet distinct de la production (« hiver-solidaire ») : sans lui, lancer ce fichier
# sur le serveur remplacerait le conteneur db de production et réutiliserait son volume.
name: hiver-solidaire-dev

services:
  db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hiver}
      POSTGRES_USER: ${POSTGRES_USER:-hiver}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copier .env.example vers .env}
    ports:
      # 5433 par défaut : 5432 est souvent déjà pris par un autre PostgreSQL sur la machine.
      - "127.0.0.1:${DEV_DB_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Boîte de réception de développement : l'appli y envoie le lien de connexion (MAIL_HOST=localhost,
  # MAIL_PORT=1025), lisible sur http://127.0.0.1:8025. Jamais en production (deploy/compose.prod.yaml).
  # Les ports n'écoutent que sur 127.0.0.1 : rien n'est joignable depuis le réseau local.
  mailpit:
    image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    environment:
      MP_MAX_MESSAGES: 200
    ports:
      - "127.0.0.1:${DEV_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${DEV_MAILPIT_UI_PORT:-8025}:8025"

volumes:
  db-data:
