# Production sur le homelab. Voir deploy/README.md.
# Les variables viennent du fichier .env placé à côté de ce fichier, sur le serveur uniquement.
name: hiver-solidaire

# Taille des logs bornée sur chaque service (S6) : 3 fichiers de 10 Mo au plus, puis rotation par Docker.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    image: ghcr.io/marcocopops/hiver-solidaire:${APP_TAG:-main}
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?POSTGRES_DB manquant dans .env}
      DB_USER: ${POSTGRES_USER:?POSTGRES_USER manquant dans .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      # Origine des liens envoyés par e-mail (connexion, désinscription, back-office).
      APP_BASE_URL: ${APP_BASE_URL:-https://hiver-solidaire.marcantoine-meunier.com}
      # SMTP de Brevo (deploy/README.md, « E-mails »). Sans MAIL_HOST : l'appli démarre, la connexion affiche
      # « momentanément indisponible » et les e-mails automatiques attendent puis expirent. MAIL_FROM est alors
      # obligatoire (adresse du domaine authentifié chez Brevo). Valeurs réelles dans .env, jamais dans le dépôt.
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      MAIL_FROM: ${MAIL_FROM:-}
      # Cloudflare Turnstile sur la demande de lien (ADR-0013, deploy/README.md « Turnstile »). Sans clés, ou avec les clés
      # de test de .env.example : l'appli démarre et la connexion affiche « momentanément indisponible ».
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      # Adresses des coordinateurs, séparées par des virgules (ADR-0010) : rôle coordinateur à la connexion. Vide :
      # back-office fermé à tous. Valeurs réelles dans .env sur le serveur, jamais dans le dépôt.
      APP_COORDINATOR_EMAILS: ${APP_COORDINATOR_EMAILS:-}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    cpus: 1.0
    mem_limit: 768m
    pids_limit: 256
    networks:
      edge:
        # Alias unique : le réseau edge est partagé avec d'autres applis (cv-assistant...),
        # un nom générique comme « app » risquerait d'être ambigu pour cloudflared.
        aliases: [hiver-solidaire-app]
      internal: {}
    # Aucun « ports: » : seul cloudflared, sur edge, joint l'appli (port 8080).
    # Le port de management (8081) n'est joignable que depuis le conteneur (healthcheck).

  db:
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    logging: *logging
    user: "70:70"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manquant dans .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    read_only: true
    tmpfs:
      - /tmp
      - /run/postgresql
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # Sauvegardes chiffrées vers Cloudflare R2 (deploy/backup.sh, deploy/restore.sh, ADR-0016). Profil « backup » :
  # jamais démarré par « up -d » ni par update.sh, seulement par « docker compose run » depuis les scripts, qui lui
  # passent l'utilisateur du script et le dump à envoyer (en lecture seule). Il ne voit ni la base ni l'appli.
  restic:
    image: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
    profiles: [backup]
    logging: *logging
    # Dépôt, mot de passe restic et clé R2 limitée au bucket : backup.env, à côté de ce fichier, chmod 600
    # (modèle : backup.env.example). Absent, restic échoue et backup.sh envoie l'alerte.
    env_file:
      - path: backup.env
        required: false
    environment:
      # Cache dans la mémoire du conteneur : rien de persistant sur l'hôte.
      RESTIC_CACHE_DIR: /tmp/restic-cache
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 128
    networks:
      - backup

networks:
  # Réseau partagé avec le conteneur cloudflared existant, créé une fois : docker network create edge
  edge:
    external: true
  # Entre app et db seulement, sans accès à l'extérieur.
  internal:
    internal: true
  # Sortie vers R2 pour restic seulement : ni l'appli ni la base n'y sont.
  backup: {}

volumes:
  db-data:
