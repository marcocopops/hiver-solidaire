# Rotation des logs des scripts d'exploitation (update.sh, backup.sh), lancés par cron. Voir deploy/README.md.
# Installation : cp /opt/hiver-solidaire/logrotate.conf /etc/logrotate.d/hiver-solidaire
/var/log/hiver-solidaire/*.log {
    weekly
    maxsize 5M
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    # cron écrit en ajout (>>) : on copie puis on vide, sans recréer le fichier.
    copytruncate
    su root root
}
